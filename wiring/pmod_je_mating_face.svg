<text x="780" y="663" font-family="DejaVu Sans" font-size="17" font-weight="750" fill="#006d68" text-anchor="middle">ZYBO PCB EDGE  •  lower row is closest to the PCB</text>
<rect x="48" y="724" width="1464" height="191" rx="15" fill="#ffffff" stroke="#d9e3e9" stroke-width="1.6"/>
<text x="79" y="764" font-family="DejaVu Sans" font-size="15" font-weight="750" fill="#006d68" text-anchor="start">BOARD ORIENTATION CHECK</text>
<text x="79" y="799" font-family="DejaVu Sans" font-size="21" font-weight="650" fill="#142638" text-anchor="start">With the switches nearest you, JE is the leftmost Pmod along the switch-side edge.</text>
<text x="79" y="835" font-family="DejaVu Sans" font-size="19" font-weight="500" fill="#4b6174" text-anchor="start">Use the PCB’s JE and 3V3/GND markings to confirm the end; don’t mirror this view onto the back of a mating plug.</text>
<text x="79" y="871" font-family="DejaVu Sans" font-size="19" font-weight="500" fill="#4b6174" text-anchor="start">JE5 and JE11 are common ground. JE6 and JE12 are the same 3.3 V rail. Leave JE9 and JE10 open.</text>
<line x1="48" y1="946" x2="1512" y2="946" stroke="#d9e3e9" stroke-width="1.5" stroke-linecap="round" />
<text x="48" y="975" font-family="DejaVu Sans" font-size="15" font-weight="500" fill="#4b6174" text-anchor="start">Source: Digilent Zybo Z7 reference manual, Figure 16.1 and Table 16.1; master XDC, JE section.</text>
<text x="1512" y="975" font-family="DejaVu Sans Mono" font-size="15" font-weight="750" fill="#006d68" text-anchor="end">DESIGN 1.0  /  3.3 V ONLY</text>
</svg>
