<text x="79" y="217" font-family="DejaVu Sans" font-size="15" font-weight="750" fill="#006d68" text-anchor="start">VIEW FROM OUTSIDE THE BOARD  /  LOOK STRAIGHT INTO THE FEMALE SOCKET</text>
<text x="79" y="248" font-family="DejaVu Sans" font-size="21" font-weight="650" fill="#142638" text-anchor="start">Pin 1 is the upper-right socket. The power pair is at the opposite end.</text>
