<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1000" viewBox="0 0 1560 1000" role="img"><title>Read the left I²S word</title><desc>48 kHz sample rate  •  3.072 MHz SCK  •  64 SCK per frame  •  24-bit signed data on each independent SD</desc>
<rect x="0" y="0" width="1560" height="1000" rx="0" fill="#f2f6f8" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1560" height="143" rx="0" fill="#142638" stroke="none" stroke-width="1"/>
<text x="48" y="38" font-family="DejaVu Sans" font-size="16" font-weight="750" fill="#80d7ce" text-anchor="start">ZYBO Z7-20   /   PMOD JE   /   INMP441</text>
<text x="48" y="94" font-family="DejaVu Sans" font-size="44" font-weight="750" fill="#ffffff" text-anchor="start">Read the left I²S word</text>
<text x="50" y="124" font-family="DejaVu Sans" font-size="17" font-weight="500" fill="#d5e4ed" text-anchor="start">48 kHz sample rate  •  3.072 MHz SCK  •  64 SCK per frame  •  24-bit signed data on each independent SD</text>
<text x="1510" y="50" font-family="DejaVu Sans Mono" font-size="18" font-weight="750" fill="#a8bccc" text-anchor="end">05 / TIMING</text>
<rect x="48" y="177" width="1464" height="278" rx="15" fill="#ffffff" stroke="#d9e3e9" stroke-width="1.6"/>
<text x="78" y="216" font-family="DejaVu Sans" font-size="15" font-weight="750" fill="#006d68" text-anchor="start">ONE FULL STEREO FRAME  /  COUNTS PER WS PHASE</text>
<line x1="279" y1="241" x2="279" y2="414" stroke="#d9e3e9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<line x1="862" y1="241" x2="862" y2="414" stroke="#d9e3e9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<line x1="1445" y1="241" x2="1445" y2="414" stroke="#d9e3e9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<text x="85" y="314" font-family="DejaVu Sans Mono" font-size="21" font-weight="750" fill="#142638" text-anchor="start">WS</text>
<path d="M 227 281 H 279 V 316 H 862 V 281 H 1445 V 316 H 1474" stroke="#167338" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="570.5" y="302" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#142638" text-anchor="middle">LOW / LEFT • 32 SCK</text>
<text x="1153.5" y="312" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#142638" text-anchor="middle">HIGH / RIGHT • 32 SCK</text>
<text x="85" y="385" font-family="DejaVu Sans Mono" font-size="21" font-weight="750" fill="#142638" text-anchor="start">SD</text>
<line x1="228" y1="377" x2="297.21875" y2="377" stroke="#8e9aaa" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<rect x="297.21875" y="355" width="437.25" height="44" rx="5" fill="#e5f2ef" stroke="#006d68" stroke-width="1.5"/>
<text x="515.84375" y="383" font-family="DejaVu Sans" font-size="17" font-weight="750" fill="#006d68" text-anchor="middle">24 ACTIVE BITS  /  MSB FIRST</text>
<line x1="734.46875" y1="377" x2="1474" y2="377" stroke="#8e9aaa" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="1153.5" y="405" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#4b6174" text-anchor="middle">HIGH-Z  •  IGNORE RIGHT SLOT</text>
<rect x="48" y="474" width="1464" height="426" rx="15" fill="#ffffff" stroke="#d9e3e9" stroke-width="1.6"/>
<text x="78" y="516" font-family="DejaVu Sans" font-size="15" font-weight="750" fill="#006d68" text-anchor="start">ZOOM AT WS FALLING EDGE  /  RISING SCK EDGES ARE CAPTURE POINTS</text>
<line x1="226" y1="567" x2="1449" y2="567" stroke="#d9e3e9" stroke-width="1" stroke-linecap="round" />
<line x1="442.5" y1="551" x2="442.5" y2="795" stroke="#b7c8d1" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 6"/>
<text x="442.5" y="552" font-family="DejaVu Sans" font-size="14" font-weight="650" fill="#4b6174" text-anchor="middle">WS low seen</text>
<line x1="621.5" y1="551" x2="621.5" y2="795" stroke="#b7c8d1" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 6"/>
<text x="621.5" y="552" font-family="DejaVu Sans" font-size="14" font-weight="650" fill="#4b6174" text-anchor="middle">Capture bit 23</text>
<line x1="800.5" y1="551" x2="800.5" y2="795" stroke="#b7c8d1" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 6"/>
<text x="800.5" y="552" font-family="DejaVu Sans" font-size="14" font-weight="650" fill="#4b6174" text-anchor="middle">Capture bit 22</text>
<line x1="979.5" y1="551" x2="979.5" y2="795" stroke="#b7c8d1" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 6"/>
<text x="979.5" y="552" font-family="DejaVu Sans" font-size="14" font-weight="650" fill="#4b6174" text-anchor="middle">Capture bit 21</text>
<line x1="1158.5" y1="551" x2="1158.5" y2="795" stroke="#b7c8d1" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 6"/>
<line x1="1337.5" y1="551" x2="1337.5" y2="795" stroke="#b7c8d1" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 6"/>
<text x="88" y="609" font-family="DejaVu Sans Mono" font-size="21" font-weight="750" fill="#142638" text-anchor="start">SCK</text>
<path d="M 226 586 H 353 V 618 H 442.5 V 586 H 532 V 618 H 621.5 V 586 H 711 V 618 H 800.5 V 586 H 890 V 618 H 979.5 V 586 H 1069 V 618 H 1158.5 V 586 H 1248 V 618 H 1337.5 V 586 H 1427 V 618" stroke="#165aca" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="678" font-family="DejaVu Sans Mono" font-size="21" font-weight="750" fill="#142638" text-anchor="start">WS</text>
<path d="M 226 648 H 353 V 688 H 1450" stroke="#167338" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="753" font-family="DejaVu Sans Mono" font-size="21" font-weight="750" fill="#142638" text-anchor="start">SD</text>
<line x1="226" y1="746" x2="532" y2="746" stroke="#8e9aaa" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<rect x="532" y="728" width="179" height="37" rx="4" fill="#e5f2ef" stroke="#006d68" stroke-width="1"/>
<text x="621.5" y="752" font-family="DejaVu Sans Mono" font-size="16" font-weight="750" fill="#006d68" text-anchor="middle">23 / MSB</text>
<rect x="711" y="728" width="179" height="37" rx="4" fill="#e5f2ef" stroke="#006d68" stroke-width="1"/>
<text x="800.5" y="752" font-family="DejaVu Sans Mono" font-size="16" font-weight="750" fill="#006d68" text-anchor="middle">22</text>
<rect x="890" y="728" width="179" height="37" rx="4" fill="#e5f2ef" stroke="#006d68" stroke-width="1"/>
<text x="979.5" y="752" font-family="DejaVu Sans Mono" font-size="16" font-weight="750" fill="#006d68" text-anchor="middle">21</text>
<rect x="1069" y="728" width="179" height="37" rx="4" fill="#e5f2ef" stroke="#006d68" stroke-width="1"/>
<text x="1158.5" y="752" font-family="DejaVu Sans Mono" font-size="16" font-weight="750" fill="#006d68" text-anchor="middle">20</text>
<rect x="1248" y="728" width="179" height="37" rx="4" fill="#e5f2ef" stroke="#006d68" stroke-width="1"/>
<text x="1337.5" y="752" font-family="DejaVu Sans Mono" font-size="16" font-weight="750" fill="#006d68" text-anchor="middle">…</text>
<text x="79" y="838" font-family="DejaVu Sans" font-size="18" font-weight="650" fill="#142638" text-anchor="start">Generate WS changes on falling SCK edges. Skip the first rising edge after each WS change, then capture 24.</text>
<text x="79" y="870" font-family="DejaVu Sans" font-size="17" font-weight="500" fill="#4b6174" text-anchor="start">SD releases after the LSB; the pull-down discharges the line. Discard all bit times outside the active word.</text>
<line x1="48" y1="946" x2="1512" y2="946" stroke="#d9e3e9" stroke-width="1.5" stroke-linecap="round" />
<text x="48" y="975" font-family="DejaVu Sans" font-size="15" font-weight="500" fill="#4b6174" text-anchor="start">Timing is conceptual. Check actual transitions at the module and at the FPGA data connection during bring-up.</text>
<text x="1512" y="975" font-family="DejaVu Sans Mono" font-size="15" font-weight="750" fill="#006d68" text-anchor="end">DESIGN 1.0  /  3.3 V ONLY</text>
</svg>
